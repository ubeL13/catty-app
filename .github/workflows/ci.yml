name: CI - Тестирование приложения

on:
  push:
    branches:
      - main
      - github-actions
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run site tests
        run: |
          echo "🚀 Starting tests..."
          chmod +x test.sh
          ./test.sh