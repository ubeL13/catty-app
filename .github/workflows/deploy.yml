name: CD - Deploy via Docker

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -p 2458 ulyana@course.prafdin.ru "echo 'SSH connection successful'"

      - name: Deploy container
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: ulyana
          port: 2458
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔁 Pull new Docker image..."
            docker stop catty-container || true
            docker rm catty-container || true
            docker pull ghcr.io/ubel13/catty-app:latest
            docker run -d -p 8181:8181 --name catty-container ghcr.io/ubel13/catty-app:latest
            echo "✅ Deployed new version!"