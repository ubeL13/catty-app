name: catty-reminders
services:
  database:
    image: mysql:5.7.36
    container_name: catty-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - catty-network

  backend:
    image: ghcr.io/ubel13/catty-app:latest
    # build: ./
    container_name: catty-backend
    restart: unless-stopped
    ports:
      - "8181:8181"
    depends_on:
      - database
    networks:
      - catty-network

  nginx:
    image: nginx:latest
    container_name: catty-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - catty-network

networks:
  catty-network:
    driver: bridge

volumes:
  mysql_data: