services:
  backend:
    image: ghcr.io/ubel13/catty-app:latest
    ports:
      - "8181:8181"
    volumes:
      - app-data:/app/data
    environment:
      - DATABASE_URL=postgresql://catty:cattypass@db:5432/cattydb
    depends_on:
      - db
    restart: unless-stopped

  db:
  image: mysql:8.0
  environment:
    MYSQL_ROOT_PASSWORD: rootpass
    MYSQL_DATABASE: cattydb
    MYSQL_USER: catty
    MYSQL_PASSWORD: cattypass
  command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
  db-data: