version: '3.8'

services:
  backend:
    image: ghcr.io/ubel13/catty-app:latest
    ports:
      - "8181:8181"
    volumes:
      - app-data:/app/data
    environment:
      - DATABASE_URL=postgresql://catty:cattypass@db:5432/cattydb
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: catty
      POSTGRES_PASSWORD: cattypass
      POSTGRES_DB: cattydb
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
  db-data: